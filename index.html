<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospecção WhatsApp</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#131a26; --panel2:#0f1622; --border:#22304a;
    --txt:#e7edf7; --muted:#8ea0bd; --brand:#7c6cff; --brand2:#00d3a7;
    --amber:#ffb020; --red:#ff5470; --green:#22c55e; --blue:#38bdf8;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1100px 560px at 82% -12%, #1a2338 0%, transparent 55%),var(--bg);
    color:var(--txt);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 48px}
  .head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .head .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:16px}
  .head h1{font-size:20px;margin:0;font-weight:800}
  .head small{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .upd{color:var(--muted);font-size:12.5px;margin:12px 0 16px}
  .upd b{color:var(--txt)}

  /* seletor de período */
  .rangebar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:18px}
  .rangebar .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{background:#0e1726;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .chips button:hover{color:var(--txt);border-color:#32436a}
  .chips button.on{background:linear-gradient(135deg,var(--brand),#6a5bff);color:#fff;border-color:transparent}
  .dates{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .dates label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
  .dates input{background:#0e1726;border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:7px 9px;font-size:13px;font-family:inherit;color-scheme:dark}
  .dates input:focus{outline:none;border-color:var(--brand)}
  .periodo{font-size:12.5px;color:var(--muted);margin:-6px 0 16px}
  .periodo b{color:var(--brand2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;position:relative;overflow:hidden}
  .kpi .ic{position:absolute;right:13px;top:12px;font-size:18px;opacity:.5}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
  .kpi .val{font-size:27px;font-weight:800;margin-top:5px;line-height:1}
  .kpi .hint{font-size:11px;color:var(--muted);margin-top:7px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .panel h2{font-size:15px;margin:0 0 3px}
  .panel .desc{color:var(--muted);font-size:12px;margin-bottom:15px}
  .funnel{display:flex;flex-direction:column;gap:9px}
  .fstage{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px}
  .fstage .name{font-size:13px;font-weight:600}
  .fstage .bar{height:30px;border-radius:8px;background:#0e1726;position:relative;overflow:hidden}
  .fstage .fill{height:100%;border-radius:8px;min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .fstage .rate{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:600}
  .fstage .num{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .week{display:flex;align-items:flex-end;gap:7px;height:160px;padding-top:16px;overflow-x:auto}
  .week .col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .week .cbar{width:72%;max-width:34px;background:linear-gradient(180deg,var(--brand),#5a4bd8);border-radius:7px 7px 0 0;min-height:4px;position:relative}
  .week .cbar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
  .week .clbl{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase}
  .tag{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .loc{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:22px}
  @media (max-width:560px){
    .dates{margin-left:0}
    .fstage{grid-template-columns:82px 1fr 38px}
    th:nth-child(3),td:nth-child(3){display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="dot">✦</div><div><h1>Prospecção <span style="color:var(--brand2)">WhatsApp</span></h1><small>Disparos automáticos · Atlas Assessoria</small></div></div>
  <div class="upd" id="upd"></div>

  <div class="rangebar">
    <span class="lbl">Período</span>
    <div class="chips" id="chips">
      <button data-preset="7">Últimos 7 dias</button>
      <button data-preset="semana">Esta semana</button>
      <button data-preset="mes">Este mês</button>
      <button data-preset="tudo" class="on">Tudo</button>
    </div>
    <div class="dates">
      <label>De <input type="date" id="de"></label>
      <label>Até <input type="date" id="ate"></label>
    </div>
  </div>
  <div class="periodo" id="periodo"></div>

  <div id="conteudo"></div>
</div>

<script src="disparos-dashboard.js" onerror="window.DISPAROS=null"></script>
<script>
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>Number(n).toLocaleString('pt-BR');
const $=s=>document.querySelector(s);
const parseLocal=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const brData=s=>{const d=parseLocal(s);return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'):s;};

const D = window.DISPAROS;
const EV = (D && D.eventos) ? D.eventos : [];

function hojeStr(){ return ymd(new Date()); }
function minData(){ return EV.length ? EV.reduce((m,e)=>e.data<m?e.data:m, EV[0].data) : (D && D.primeiroDia) || hojeStr(); }

function presetRange(p){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  if(p==='7'){ const de=new Date(hoje); de.setDate(de.getDate()-6); return [ymd(de), ymd(hoje)]; }
  if(p==='semana'){ const off=(hoje.getDay()+6)%7; const de=new Date(hoje); de.setDate(de.getDate()-off); return [ymd(de), ymd(hoje)]; }
  if(p==='mes'){ const de=new Date(hoje.getFullYear(),hoje.getMonth(),1); return [ymd(de), ymd(hoje)]; }
  return [minData(), ymd(hoje)]; // tudo
}

function calcular(de, ate){
  const evs = EV.filter(e => e.data>=de && e.data<=ate);
  const env = evs.filter(e=>e.res==='enviado');
  const primeiros = evs.filter(e=>e.etapa===0 && (e.res==='enviado'||e.res==='conversa_existente')).length;
  const follow1 = env.filter(e=>e.etapa===1).length;
  const follow2 = env.filter(e=>e.etapa===2).length;
  const respostas = evs.filter(e=>e.res==='respondeu').length;
  const invalidos = evs.filter(e=>e.res==='invalido').length;
  const mensagens = env.length;
  // por dia (só dias com atividade)
  const dmap={};
  for(const e of env){ (dmap[e.data] = dmap[e.data] || {data:e.data,total:0,primeiros:0,follows:0}); dmap[e.data].total++; if(e.etapa===0) dmap[e.data].primeiros++; else dmap[e.data].follows++; }
  for(const e of evs){ if(e.res==='respondeu'){ (dmap[e.data]=dmap[e.data]||{data:e.data,total:0,primeiros:0,follows:0}); } }
  const porDia = Object.values(dmap).sort((a,b)=>a.data<b.data?-1:1);
  // por estado
  const ordem = (D && D.estados) || [];
  const umap={};
  for(const e of evs){ const u=e.uf||'—'; umap[u]=umap[u]||{uf:u,contatos:0,respostas:0}; if(e.etapa===0 && e.res==='enviado') umap[u].contatos++; if(e.res==='respondeu') umap[u].respostas++; }
  const porEstado = Object.values(umap).filter(x=>x.contatos||x.respostas).sort((a,b)=>{const ia=ordem.indexOf(a.uf),ib=ordem.indexOf(b.uf);return (ia<0?99:ia)-(ib<0?99:ib)||b.contatos-a.contatos;});
  // últimos
  const ultimos = evs.slice().sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora)).slice(0,12);
  const diasAtivos = porDia.length;
  return {de,ate,mensagens,primeiros,follow1,follow2,follows:follow1+follow2,respostas,invalidos,porDia,porEstado,ultimos,diasAtivos,
    taxaResposta: primeiros?Math.round(respostas/primeiros*1000)/10:0,
    mediaDia: diasAtivos?Math.round(mensagens/diasAtivos*10)/10:0};
}

function render(R){
  const base = (D && D.base) || 0;
  $('#periodo').innerHTML = R.mensagens||R.respostas||R.diasAtivos ?
    `Mostrando <b>${brData(R.de)} a ${brData(R.ate)}</b> · ${R.diasAtivos} dia(s) com envio` :
    `Nenhum disparo entre <b>${brData(R.de)} e ${brData(R.ate)}</b>`;

  const kpis=[
    {lbl:'Mensagens enviadas',val:nf(R.mensagens),hint:R.follows+' follow-ups',ic:'📨'},
    {lbl:'1º contatos (alcançados)',val:nf(R.primeiros),hint:'clínicas novas',ic:'🎯'},
    {lbl:'Responderam',val:nf(R.respostas),hint:R.taxaResposta+'% de resposta',ic:'💬'},
    {lbl:'Média por dia',val:R.mediaDia,hint:R.diasAtivos+' dia(s) ativo(s)',ic:'📊'},
    {lbl:'Inválidos',val:nf(R.invalidos),hint:'números sem WhatsApp',ic:'🚫'},
  ];
  let html = `<div class="grid">`+kpis.map(k=>`<div class="kpi"><div class="ic">${k.ic}</div><div class="lbl">${k.lbl}</div><div class="val">${k.val}</div><div class="hint">${k.hint}</div></div>`).join('')+`</div>`;

  // funil
  const stages=[
    {label:'1º contato',n:R.primeiros,c:'var(--blue)'},
    {label:'Follow-up 1',n:R.follow1,c:'#a99bff'},
    {label:'Follow-up 2',n:R.follow2,c:'var(--amber)'},
    {label:'Responderam',n:R.respostas,c:'var(--green)'},
  ];
  const fmax=Math.max(stages[0].n,1);
  html += `<div class="row" style="align-items:stretch">
    <div class="panel" style="flex:1;min-width:300px"><h2>Cadência de disparos</h2><div class="desc">1º contato → follow-up 1 → follow-up 2 → responderam</div><div class="funnel">`+
    stages.map((s,i)=>{const w=Math.max(s.n/fmax*100,3);const rate=i===0?'':(stages[0].n?Math.round(s.n/stages[0].n*100)+'%':'');
      return `<div class="fstage"><div class="name">${s.label}</div><div class="bar"><div class="fill" style="width:${w}%;background:linear-gradient(90deg,${s.c},${s.c}bb)"></div>${rate?`<div class="rate">${rate}</div>`:''}</div><div class="num">${s.n}</div></div>`;}).join('')+
    `</div></div>`;

  // por dia
  const wmax=Math.max(...R.porDia.map(d=>d.total),1);
  html += `<div class="panel" style="flex:1;min-width:300px"><h2>Contatos por dia</h2><div class="desc">Mensagens enviadas por dia${D&&D.metaDia?' · meta '+D.metaDia+'/dia':''}</div><div class="week">`+
    (R.porDia.length?R.porDia.map(d=>`<div class="col"><div class="cbar" style="height:${Math.max(d.total/wmax*100,4)}%" title="${d.primeiros} de 1º contato · ${d.follows} follow-up"><span>${d.total}</span></div><div class="clbl">${brData(d.data)}</div></div>`).join(''):'<div class="empty" style="margin:auto">Sem envios no período</div>')+
    `</div></div></div>`;

  // por estado + últimos
  html += `<div class="row" style="align-items:stretch">
    <div class="panel" style="flex:1;min-width:280px"><h2>Por estado</h2><div class="desc">Na ordem de prospecção</div>
      <table><thead><tr><th>UF</th><th>Contatos</th><th>Respostas</th><th>Na base</th></tr></thead><tbody>`+
      (R.porEstado.length?R.porEstado.map(e=>`<tr><td><b>${esc(e.uf)}</b></td><td>${e.contatos}</td><td>${e.respostas}</td><td class="loc">${nf((D.porUFbase||{})[e.uf]||0)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Sem contatos no período</td></tr>')+
      `</tbody></table></div>
    <div class="panel" style="flex:1.5;min-width:300px"><h2>Últimos contatos</h2><div class="desc">Atividade no período selecionado</div>
      <table><thead><tr><th>Quando</th><th>Clínica</th><th>Local</th><th>Etapa</th><th>Resultado</th></tr></thead><tbody>`+
      (R.ultimos.length?R.ultimos.map(u=>{const et=u.etapa===0?'1º contato':('Follow '+u.etapa);const m={enviado:['#0b3b2e','#36d39b','Enviado'],respondeu:['#0e3450','#58b6ff','Respondeu'],invalido:['#3a2330','#ff7a9c','Inválido'],falha:['#3a2a12','#ffb347','Falha'],conversa_existente:['#2a2340','#a99bff','Já em conversa']}[u.res]||['#1a2437','#9fb0c9',u.res];
        return `<tr><td class="loc">${brData(u.data)} ${esc(u.hora)}</td><td><b>${esc(u.empresa)}</b></td><td class="loc">${esc([u.cidade,u.uf].filter(Boolean).join(' / '))}</td><td>${et}</td><td><span class="tag" style="background:${m[0]};color:${m[1]}">${m[2]}</span></td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">Sem registros no período</td></tr>')+
      `</tbody></table></div></div>`;

  $('#conteudo').innerHTML = html;
}

function aplicar(de, ate){ $('#de').value=de; $('#ate').value=ate; render(calcular(de, ate)); }

function init(){
  if(!D){
    $('#upd').textContent='';
    $('#conteudo').innerHTML='<div class="panel"><div class="empty">⏳ Sem dados ainda. Rode a automação pelo atalho <b>INICIAR Prospeccao</b> no PC — ao final do dia os números aparecem aqui.</div></div>';
    $('.rangebar').style.display='none'; return;
  }
  const g=new Date(D.gerado);
  const prog = (D.totais && D.totais.progresso!=null) ? D.totais.progresso : 0;
  $('#upd').innerHTML='Atualizado em <b>'+g.toLocaleDateString('pt-BR')+' '+g.toTimeString().slice(0,5)+'</b> · base de '+nf(D.base)+' leads · <b>'+prog+'%</b> da base já alcançada no total';
  // chips
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const [de,ate]=presetRange(b.dataset.preset); aplicar(de,ate);
  });
  // inputs de data manuais
  ['de','ate'].forEach(id=>$('#'+id).addEventListener('change',()=>{
    document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));
    const de=$('#de').value||minData(), ate=$('#ate').value||hojeStr();
    render(calcular(de, ate));
  }));
  // limites dos inputs
  $('#de').min=minData(); $('#ate').max=hojeStr();
  // começa em "Tudo"
  const [de,ate]=presetRange('tudo'); aplicar(de,ate);
}
init();
// recarrega de tempos em tempos para pegar a importação do fim do dia
setInterval(()=>location.reload(), 10*60*1000);
</script>
</body>
</html>
